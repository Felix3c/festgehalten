name: Köln-Fall — Wartezeit Kundenzentren messen
# Belegt koeln-2026-077 bis -082 und Wette 9 (privat). Läuft nur auf master.
# Terminfreie Zeiten der Stadt: Mo 7:30–15:00, Mi 7:30–12:00 Ortszeit.
#
# GitHubs Zeitplan ist unzuverlässig: Mo 14.09.2026 beide Läufe nie gestartet,
# Mi 16.09.2026 der Lauf 5 h 20 min zu spät (15:27 MESZ, nach Schließung) und
# der Wächter gar nicht. Deshalb seit 16.09. zwei Schichten:
#   1. Viele Startversuche, über das ganze Fenster verteilt (unten). Cron ist
#      UTC; die Minuten sind so gewählt, dass jeder Versuch in Sommer- UND
#      Winterzeit im Fenster liegt (Vormittag: 06:30–10:00 UTC, Mo-Nachmittag:
#      11:00–13:00 UTC). Krumme Minuten, weil volle/halbe Stunden am
#      häufigsten ausfallen.
#   2. messen.py misst nur im Messfenster und je Slot (vormittag/nachmittag)
#      nur einmal (fenster.py). Verspätete oder doppelte Starts erzeugen
#      deshalb keine Zeile, sondern beenden sich mit "keine Messung".
# Ergebnis bleibt: höchstens 3 Abrufe je Woche (Mo vormittag, Mo nachmittag,
# Mi vormittag), egal wie viele Versuche GitHub tatsächlich startet.
on:
  schedule:
    # Vormittag Mo + Mi: 08:37 09:11 09:43 10:19 10:51 11:27 MESZ
    #                    07:37 08:11 08:43 09:19 09:51 10:27 MEZ
    - cron: "37 6 * * 1,3"
    - cron: "11 7 * * 1,3"
    - cron: "43 7 * * 1,3"
    - cron: "19 8 * * 1,3"
    - cron: "51 8 * * 1,3"
    - cron: "27 9 * * 1,3"
    # Nachmittag Mo: 13:17 13:47 14:13 MESZ / 12:17 12:47 13:13 MEZ
    - cron: "17 11 * * 1"
    - cron: "47 11 * * 1"
    - cron: "13 12 * * 1"
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch außerhalb des Messfensters / trotz vorhandenem Abruf messen (Funktionstest)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: koeln-wartezeit
env:
  TZ: Europe/Berlin
  # Der Cron-Ausdruck, der diesen Lauf geplant hat (leer bei Run workflow / Wächter):
  # messen.py leitet daraus den Slot ab, damit ein verspäteter Vormittagslauf nicht
  # den Nachmittags-Slot belegt.
  KOELN_CRON: ${{ github.event.schedule }}
jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Feed abrufen, Wayback anstoßen, CSV ergänzen (nur im Messfenster, je Slot einmal)
        run: python recherche/koeln-wartezeit/messen.py ${{ inputs.erzwingen == true && '--erzwingen' || '' }}
      - name: Messwerte committen
        run: |
          git config user.name "koeln-wartezeit (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recherche/koeln-wartezeit/messwerte.csv
          if git diff --cached --quiet; then echo "keine neuen Zeilen"; exit 0; fi
          git commit -m "data: Köln Wartezeit Kundenzentren, Abruf $(date +%Y-%m-%dT%H:%M%z) [skip ci]"
          git push
