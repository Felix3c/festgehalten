name: Köln-Fall — Wartezeit Kundenzentren messen
# Belegt koeln-2026-077 bis -082 und Wette 9 (privat). Läuft nur auf master.
# Terminfreie Zeiten der Stadt: Mo 7:30–15:00, Mi 7:30–12:00 Ortszeit.
#
# GitHubs Zeitplan ist unzuverlässig: Mo 14.09.2026 beide Läufe nie gestartet,
# Mi 16.09.2026 der Lauf 5 h 20 min zu spät (15:27 MESZ, nach Schließung) und
# der Wächter gar nicht. Deshalb seit 16.09. zwei Schichten:
#   1. Viele Startversuche, über das ganze Fenster verteilt (unten). Cron ist
#      UTC; die Minuten sind so gewählt, dass jeder Versuch in Sommer- UND
#      Winterzeit im Fenster liegt (Vormittag: 06:30–10:00 UTC, Mo-Nachmittag:
#      11:00–13:00 UTC). Krumme Minuten, weil volle/halbe Stunden am
#      häufigsten ausfallen.
#   2. messen.py misst nur im Messfenster und je Slot (vormittag/nachmittag)
#      nur einmal (fenster.py). Verspätete oder doppelte Starts erzeugen
#      deshalb keine Zeile, sondern beenden sich mit "keine Messung".
# Ergebnis bleibt: höchstens 3 Abrufe je Woche (Mo vormittag, Mo nachmittag,
# Mi vormittag), egal wie viele Versuche GitHub tatsächlich startet.
#
# Befund 03.10.2026: Vom 21.09. bis 30.09. startete GitHub JEDEN geplanten Lauf
# 5–7 h zu spät (erster Start frühestens 12:03 UTC), also immer nach Schließung.
# Null Messungen seit 16.09. Deshalb zusätzlich frühe Versuche 00–04 UTC: kommen
# sie pünktlich, enden sie vor 7:30 mit "keine Messung"; kommen sie 5–7 h zu
# spät, landen sie im Vormittagsfenster. Stunde < 11 → Slot "vormittag".
on:
  schedule:
    # Früh Mo + Mi (Vorlauf für GitHubs Verspätung): 00:07 00:41 01:13 01:47
    # 02:19 02:53 03:29 04:03 UTC
    - cron: "7 0 * * 1,3"
    - cron: "41 0 * * 1,3"
    - cron: "13 1 * * 1,3"
    - cron: "47 1 * * 1,3"
    - cron: "19 2 * * 1,3"
    - cron: "53 2 * * 1,3"
    - cron: "29 3 * * 1,3"
    - cron: "3 4 * * 1,3"
    # Vormittag Mo + Mi: 08:37 09:11 09:43 10:19 10:51 11:27 MESZ
    #                    07:37 08:11 08:43 09:19 09:51 10:27 MEZ
    - cron: "37 6 * * 1,3"
    - cron: "11 7 * * 1,3"
    - cron: "43 7 * * 1,3"
    - cron: "19 8 * * 1,3"
    - cron: "51 8 * * 1,3"
    - cron: "27 9 * * 1,3"
    # Nachmittag Mo: 13:17 13:47 14:13 MESZ / 12:17 12:47 13:13 MEZ
    - cron: "17 11 * * 1"
    - cron: "47 11 * * 1"
    - cron: "13 12 * * 1"
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch außerhalb des Messfensters / trotz vorhandenem Abruf messen (Funktionstest)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: koeln-wartezeit
env:
  TZ: Europe/Berlin
  # Der Cron-Ausdruck, der diesen Lauf geplant hat (leer bei Run workflow / Wächter):
  # messen.py leitet daraus den Slot ab, damit ein verspäteter Vormittagslauf nicht
  # den Nachmittags-Slot belegt.
  KOELN_CRON: ${{ github.event.schedule }}
jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Feed abrufen, Wayback anstoßen, CSV ergänzen (nur im Messfenster, je Slot einmal)
        run: python recherche/koeln-wartezeit/messen.py ${{ inputs.erzwingen == true && '--erzwingen' || '' }}
      # Seit 05.10.2026 werden die Wetten an der Anzeige gemessen (Vermerk in koeln-2026-077 ff.).
      # GitHub ist die zweite Messstelle neben dem Laptop und schreibt in eine EIGENE Datei,
      # damit sich die beiden nie in derselben CSV begegnen (kein Merge-Konflikt). Die Rohkopie
      # liegt wie beim Laptop in belege-anzeige/ (Dateiname mit Zeit und Hash, kollidiert nicht).
      # auswerten.py --quelle anzeige liest beide Dateien; je Slot zählt der früheste Abruf mit Beleg.
      # Läuft auch, wenn der Feed-Schritt davor scheitert (der Feed ist seit 16.09. eingefroren).
      # Ungeklärt bis zum ersten Lauf: ob stadt-koeln.de Abrufe von GitHub-Adressen durchlässt.
      - name: Anzeige der Bürger-Seite messen (eigene Datei, Rohkopie nach belege-anzeige/)
        if: ${{ !cancelled() }}
        run: python recherche/koeln-wartezeit/messen.py --quelle anzeige --csv recherche/koeln-wartezeit/messwerte-anzeige-github.csv ${{ inputs.erzwingen == true && '--erzwingen' || '' }}
      - name: Messwerte committen
        if: ${{ !cancelled() }}
        run: |
          git config user.name "koeln-wartezeit (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recherche/koeln-wartezeit/messwerte.csv
          for pfad in recherche/koeln-wartezeit/messwerte-anzeige-github.csv recherche/koeln-wartezeit/belege-anzeige; do
            if [ -e "$pfad" ]; then git add "$pfad"; fi
          done
          if git diff --cached --quiet; then echo "keine neuen Zeilen"; exit 0; fi
          git commit -m "data: Köln Wartezeit Kundenzentren, Abruf $(date +%Y-%m-%dT%H:%M%z) [skip ci]"
          # Hat in der Zwischenzeit jemand gepusht (Laptop-Messwerte, Halter), erst darauf aufsetzen.
          git pull --rebase --quiet
          git push
