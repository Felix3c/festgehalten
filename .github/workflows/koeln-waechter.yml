name: Köln-Fall — Wächter (lief die Messung?)
# Ersetzt den Kontrollgang von Hand: prüft, ob messwerte.csv einen Abruf von heute hat.
# Läuft nach den ersten Startversuchen aus koeln-wartezeit.yml (seit 16.09.2026 neun Cron-Einträge,
# Vormittag ab 06:37 UTC, Mo-Nachmittag ab 11:17 UTC), aber noch vor Schließung der Kundenzentren
# (Mo 15:00, Mi 12:00 Ortszeit), damit Nachholen etwas bringt. Der nachgestoßene Messlauf misst
# nur im Messfenster und je Slot einmal (messen.py), doppelte Zeilen sind ausgeschlossen:
#   09:13 UTC Mo+Mi = 11:13 MESZ / 10:13 MEZ → mindestens 1 Abruf heute
#   12:43 UTC Mo    = 14:43 MESZ / 13:43 MEZ → mindestens 2 Abrufe heute
# Fehlt ein Abruf: Messlauf per workflow_dispatch nachstoßen (falls nicht schon einer läuft)
# und laut scheitern — GitHub mailt bei fehlgeschlagenen Zeitplan-Läufen. Ist das Messfenster
# schon zu (GitHub startet montags oft 4–5 h zu spät), nur melden (Frage 453, 22.10.2026).
# Krumme Minuten mit Absicht, wie beim Messlauf.
# Grenze: Fällt GitHubs Zeitplan ganz aus, fällt auch der Wächter aus. Dafür gibt es die
# Rückfallebene (Windows-Aufgaben, siehe ~/REIHENFOLGE.txt).
on:
  schedule:
    - cron: "13 9 * * 1,3"
    - cron: "43 12 * * 1"
  workflow_dispatch:
    inputs:
      erwartet:
        description: "Mindestzahl Abrufe heute (leer = automatisch)"
        default: ""
permissions:
  contents: read
  actions: write
env:
  TZ: Europe/Berlin
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Messwerte von heute zählen
        id: check
        # Seit der Messung an der Anzeige (05.10.2026) zählt die Datei der GitHub-Messstelle;
        # messwerte.csv bekommt keine Zeilen mehr, solange der Feed eingefroren ist.
        # Soll bestimmt waechter.py selbst (Frage 453, 22.10.2026): Mo 13–15 Uhr zwei Abrufe, sonst
        # einer; ist das Messfenster zu (Mo 15:00, Mi 12:00), Exit 3 = nur melden, nicht nachstoßen.
        run: |
          set +e
          if [ -n "${{ inputs.erwartet }}" ]; then extra="--erwartet ${{ inputs.erwartet }}"; else extra=""; fi
          python recherche/koeln-wartezeit/waechter.py $extra --csv recherche/koeln-wartezeit/messwerte-anzeige-github.csv
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 3 ]; then
            echo "::warning::Messung heute unvollständig, Messfenster schon zu: nur gemeldet. Laptop-Messung (messwerte-anzeige.csv) prüfen."
            echo "Messung unvollständig, Fenster zu — nur gemeldet, nichts nachgestoßen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code
        continue-on-error: true
      - name: Fehlende Messung nachstoßen und laut scheitern
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          laufend=$(gh run list --workflow koeln-wartezeit.yml --status in_progress --json databaseId --jq length)
          wartend=$(gh run list --workflow koeln-wartezeit.yml --status queued --json databaseId --jq length)
          if [ "$laufend" = 0 ] && [ "$wartend" = 0 ]; then
            gh workflow run koeln-wartezeit.yml --ref master
            echo "Messlauf per workflow_dispatch angestoßen." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Messlauf läuft oder wartet bereits — nichts angestoßen." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "::error::Messung für heute fehlte in messwerte-anzeige-github.csv. Nachgestoßen; Rückfallebene prüfen (REIHENFOLGE.txt)."
          exit 1
